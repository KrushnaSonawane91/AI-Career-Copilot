{% extends "base.html" %}

{% block title %}Sign Up | AI Career Copilot{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            ✦
        </div>

        <h1>Create Account</h1>

        <p class="auth-description">
            Start your personalized AI career journey.
        </p>


        <form method="POST" class="auth-form">

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    autocomplete="off"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="off"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="new-password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

                <small>
                    Use at least 6 characters.
                </small>

            </div>


            <button type="submit" class="primary-button auth-button">
                Create Account
            </button>

        </form>


        <div class="auth-divider">
            <span>OR</span>
        </div>


        <p class="auth-switch">
            Already have an account?
            <a href="/login">Login</a>
        </p>

    </div>

</div>

{% endblock %}
