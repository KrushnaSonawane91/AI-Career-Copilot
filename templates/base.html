<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}AI Career Copilot{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="navbar">

    <div class="nav-container">

        <a href="/dashboard" class="brand">
            <span class="brand-icon">✦</span>
            <span>AI Career Copilot</span>
        </a>

        <nav class="nav-links">

            <a href="/dashboard"
               class="{% if request.path == '/dashboard' %}active{% endif %}">
                Dashboard
            </a>

            <a href="/history"
               class="{% if request.path == '/history' %}active{% endif %}">
                History
            </a>

            <a href="/logout" class="logout-link">
                Logout
            </a>

        </nav>

    </div>

</header>


<main class="main-container">

    {% block content %}
    {% endblock %}

</main>


<footer class="footer">

    <div class="footer-content">

        <div>
            <strong>AI Career Copilot</strong>
            <p>Your AI-powered career assistant.</p>
        </div>

        <div class="footer-copy">
            © 2026 AI Career Copilot
        </div>

    </div>

</footer>

</body>
</html>
