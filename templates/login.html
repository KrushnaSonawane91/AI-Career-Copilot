{% extends "base.html" %}

{% block title %}Login | AI Career Copilot{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            ✦
        </div>

        <h1>Welcome Back 👋</h1>

        <p class="auth-description">
            Login to continue your AI-powered career journey.
        </p>


        <form method="POST" class="auth-form">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="off"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="new-password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button type="submit" class="primary-button auth-button">
                Login
            </button>

        </form>


        <div class="auth-divider">
            <span>OR</span>
        </div>


        <p class="auth-switch">
            Don't have an account?
            <a href="/signup">Create an account</a>
        </p>

    </div>

</div>

{% endblock %}
